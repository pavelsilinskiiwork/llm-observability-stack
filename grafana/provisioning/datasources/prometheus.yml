apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus          # dashboards refer to this uid, so they keep working after a rebuild
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s       # the scrape interval, so $__rate_interval is computed correctly
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
